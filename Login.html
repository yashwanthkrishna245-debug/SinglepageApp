<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YK Industries</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #fffaf0;
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #244333;
      background-image:
        linear-gradient(rgba(12, 24, 18, 0.58), rgba(12, 24, 18, 0.58)),
        url("./tirupati-forest.jpg");
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
    }

    main {
      max-width: 720px;
      padding: 40px 32px;
      border: 1px solid rgba(255, 250, 240, 0.45);
      border-radius: 16px;
      background: rgba(25, 35, 27, 0.55);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.3);
    }

    h1 {
      margin: 0;
      color: #ffe2a1;
      font-size: clamp(2rem, 6vw, 3.5rem);
    }

    p {
      margin: 16px 0 0;
      font-size: 1.1rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <h1>WELCOME TO, YK ENTERIANMENTS!</h1>
    <h2>Welcome to YK Industries</h2>
    <p>A place of devotion, peace, and nature.</p>
  </main>
</body>
</html>
