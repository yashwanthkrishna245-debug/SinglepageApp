<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Welcome to YK Industries — a place of devotion, peace, and nature.">
  <title>YK Industries</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #fffaf0;
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #244333;
      background-image:
        linear-gradient(rgba(12, 24, 18, 0.42), rgba(12, 24, 18, 0.42)),
        url("./venkateswara-swamy.jpg");
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
    }

    main {
      width: min(100%, 720px);
      padding: 40px 32px;
      border: 1px solid rgba(255, 250, 240, 0.45);
      border-radius: 16px;
      background: rgba(25, 35, 27, 0.68);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.3);
    }

    h1 {
      margin: 0;
      color: #ffe2a1;
      font-size: clamp(2rem, 6vw, 3.5rem);
    }

    h2 {
      margin: 16px 0 0;
      font-size: 1.4rem;
      line-height: 1.4;
    }

    p {
      margin: 16px 0 0;
      font-size: 1.1rem;
      line-height: 1.6;
    }

    @media (max-width: 30rem) {
      body {
        padding: 16px;
      }

      main {
        padding: 28px 20px;
      }

      h1 {
        font-size: clamp(1.75rem, 9vw, 2.5rem);
      }

      h2 {
        font-size: 1.2rem;
      }

      p {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Welcome to YK Industries</h1>
    <h2>A place of devotion, peace, and nature.</h2>
    <p>May the blessings of Lord Venkateswara bring peace and happiness.</p>
  </main>
</body>
</html>
